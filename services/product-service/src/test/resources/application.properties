# ============================================================================
# Test-only configuration.
#
# This file shadows the main src/main/resources/application.properties on the
# test classpath, so @SpringBootTest (ProductServiceApplicationTests.contextLoads)
# boots a complete, self-contained context WITHOUT the config-server, Eureka,
# or a live MySQL instance. It verifies that the entities, repositories, and JPA
# auditing wire up correctly against an in-memory database.
#
# The Mockito / standalone-MockMvc unit tests do not start a Spring context and
# are unaffected by anything here.
# ============================================================================

spring.application.name=product-service

# Do not contact the config server or service registry during tests.
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false

# In-memory H2 datasource (version managed by the Spring Boot BOM).
spring.datasource.url=jdbc:h2:mem:product_test_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate generate the schema from the @Entity classes and skip the
# MySQL-specific schema.sql / data.sql, which H2 cannot parse.
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
