# Application
spring.application.name=payment-service

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/payment_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Feign Circuit Breaker
spring.cloud.openfeign.circuitbreaker.enabled=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.enabled=true

# Dummy Payment API base URL
dummy.payment.base-url=http://localhost:9090

# Payment service own base URL (sent to dummy API as callbackUrl)
payment.callback.base-url=http://localhost:8084

# Resilience4j - order-service
resilience4j.circuitbreaker.instances.order-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.order-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.order-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.order-service.permitted-number-of-calls-in-half-open-state=3

# Resilience4j - dummy-payment-api
resilience4j.circuitbreaker.instances.dummy-payment-api.sliding-window-size=10
resilience4j.circuitbreaker.instances.dummy-payment-api.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.dummy-payment-api.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.dummy-payment-api.permitted-number-of-calls-in-half-open-state=3

# Server
server.port=8084