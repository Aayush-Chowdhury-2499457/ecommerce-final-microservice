spring.application.name=review-service
server.port=8089

# ----- MySQL -----
spring.datasource.url=jdbc:mysql://localhost:3306/ecom_review_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ----- Eureka -----
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ----- Config Server (optional) -----
spring.cloud.config.enabled=false
spring.config.import=optional:configserver:http://localhost:8888

# ----- Feign + Circuit Breaker -----
spring.cloud.openfeign.circuitbreaker.enabled=true

# ----- Resilience4j -----
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.base-config=default

logging.level.com.cts.reviewservice=DEBUG
logging.level.feign=INFO