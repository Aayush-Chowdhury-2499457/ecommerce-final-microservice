spring.application.name=user-service
server.port=8081

# ----- MySQL -----
spring.datasource.url=jdbc:mysql://localhost:3306/ecom_user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Ritiv@03
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ----- Eureka -----
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ----- Config Server (optional) -----
spring.cloud.config.enabled=false
spring.config.import=optional:configserver:http://localhost:8888

logging.level.com.cts.userservice=DEBUG