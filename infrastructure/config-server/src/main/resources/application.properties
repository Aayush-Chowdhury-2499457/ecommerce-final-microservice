server.port=8888

spring.application.name=config-server

spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config/

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.devtools.autoconfigure.DevToolsDataSourceAutoConfiguration

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true