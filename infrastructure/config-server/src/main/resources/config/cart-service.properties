server.port=8084

# ---------- Database (MySQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/cart_service?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=25122003
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- Circuit Breaker - "productService" ----------
resilience4j.circuitbreaker.instances.productService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.productService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.productService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.productService.registerHealthIndicator=true

# ---------- Retry - "productService" ----------
resilience4j.retry.instances.productService.maxAttempts=3
resilience4j.retry.instances.productService.waitDuration=500ms
resilience4j.retry.instances.productService.retryExceptions=feign.RetryableException,java.io.IOException,java.util.concurrent.TimeoutException

# ---------- Circuit Breaker - "orderService" (was missing) ----------
resilience4j.circuitbreaker.instances.orderService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.orderService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.orderService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.orderService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.orderService.registerHealthIndicator=true

# ---------- Retry - "orderService" (placeOrder is non-idempotent -> no retry) ----------
resilience4j.retry.instances.orderService.maxAttempts=1

# ---------- Rate Limiters ----------
resilience4j.ratelimiter.instances.productService.limitForPeriod=10
resilience4j.ratelimiter.instances.productService.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.productService.timeoutDuration=500ms
resilience4j.ratelimiter.instances.orderService.limitForPeriod=10
resilience4j.ratelimiter.instances.orderService.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.orderService.timeoutDuration=500ms

# ---------- Feign timeouts ----------
spring.cloud.openfeign.client.config.product-service.connect-timeout=2000
spring.cloud.openfeign.client.config.product-service.read-timeout=3000
spring.cloud.openfeign.client.config.order-service.connect-timeout=2000
spring.cloud.openfeign.client.config.order-service.read-timeout=3000