server.port=8084


# ---------- Database (MySQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/cart_service?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:aayush@2499457}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ---------- Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ---------- Resilience4j Circuit Breaker ? "productService" ----------
resilience4j.circuitbreaker.instances.productService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.productService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.productService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.productService.registerHealthIndicator=true


# ---------- Resilience4j Retry ? "productService" ----------
resilience4j.retry.instances.productService.maxAttempts=3
resilience4j.retry.instances.productService.waitDuration=500ms
resilience4j.retry.instances.productService.retryExceptions=feign.RetryableException,java.io.IOException,java.util.concurrent.TimeoutException