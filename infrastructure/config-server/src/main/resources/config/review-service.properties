server.port=8086


# ---------- Database (MySQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/review_service?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=aayush@2499457
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ---------- Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ---------- Resilience4j Circuit Breaker ? "orderService" ----------
resilience4j.circuitbreaker.instances.orderService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.orderService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.orderService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.orderService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.orderService.registerHealthIndicator=true


# ---------- Resilience4j Retry ? "orderService" ----------
resilience4j.retry.instances.orderService.maxAttempts=3
resilience4j.retry.instances.orderService.waitDuration=500ms
resilience4j.retry.instances.orderService.retryExceptions=feign.RetryableException,java.io.IOException,java.util.concurrent.TimeoutException