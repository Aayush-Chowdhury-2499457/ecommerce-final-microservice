server.port=8087


# ---------- Database (MySQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/payment_service?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ---------- Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ---------- Dummy Payment API ----------
# Standalone external service ? NOT in Eureka. Direct URL.
dummy.payment.base-url=http://localhost:9090


# ---------- Resilience4j Circuit Breaker ? "dummyPayment" ----------
resilience4j.circuitbreaker.instances.dummyPayment.slidingWindowSize=10
resilience4j.circuitbreaker.instances.dummyPayment.failureRateThreshold=50
resilience4j.circuitbreaker.instances.dummyPayment.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.dummyPayment.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.dummyPayment.registerHealthIndicator=true


# ---------- Resilience4j Retry ? "dummyPayment" ----------
resilience4j.retry.instances.dummyPayment.maxAttempts=3
resilience4j.retry.instances.dummyPayment.waitDuration=500ms
resilience4j.retry.instances.dummyPayment.retryExceptions=feign.RetryableException,java.io.IOException,java.util.concurrent.TimeoutException


# ---------- Resilience4j Circuit Breaker ? "orderService" ----------
resilience4j.circuitbreaker.instances.orderService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.orderService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.orderService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.orderService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.orderService.registerHealthIndicator=true


# ---------- Resilience4j Retry ? "orderService" ----------
resilience4j.retry.instances.orderService.maxAttempts=3
resilience4j.retry.instances.orderService.waitDuration=500ms
resilience4j.retry.instances.orderService.retryExceptions=feign.RetryableException,java.io.IOException,java.util.concurrent.TimeoutException