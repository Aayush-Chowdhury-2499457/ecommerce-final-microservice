server.port=8085

# ---------- Database (MySQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/order_service?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=25122003
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- Circuit Breaker - "cartService" ----------
resilience4j.circuitbreaker.instances.cartService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.cartService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.cartService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.cartService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.cartService.registerHealthIndicator=true

# ---------- Retry - "cartService" ----------
resilience4j.retry.instances.cartService.maxAttempts=3
resilience4j.retry.instances.cartService.waitDuration=500ms
resilience4j.retry.instances.cartService.retryExceptions=feign.RetryableException,java.io.IOException,java.util.concurrent.TimeoutException

# ---------- Circuit Breaker - "productService" ----------
resilience4j.circuitbreaker.instances.productService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.productService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.productService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.productService.registerHealthIndicator=true

# ---------- Retry - "productService" ----------
resilience4j.retry.instances.productService.maxAttempts=3
resilience4j.retry.instances.productService.waitDuration=500ms
resilience4j.retry.instances.productService.retryExceptions=feign.RetryableException,java.io.IOException,java.util.concurrent.TimeoutException

# ---------- Circuit Breaker - "userService" ----------
resilience4j.circuitbreaker.instances.userService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.userService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.userService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.userService.registerHealthIndicator=true

# ---------- Retry - "userService" ----------
resilience4j.retry.instances.userService.maxAttempts=3
resilience4j.retry.instances.userService.waitDuration=500ms
resilience4j.retry.instances.userService.retryExceptions=feign.RetryableException,java.io.IOException,java.util.concurrent.TimeoutException

# ---------- Rate Limiters ----------
resilience4j.ratelimiter.instances.cartService.limitForPeriod=10
resilience4j.ratelimiter.instances.cartService.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.cartService.timeoutDuration=500ms
resilience4j.ratelimiter.instances.productService.limitForPeriod=10
resilience4j.ratelimiter.instances.productService.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.productService.timeoutDuration=500ms
resilience4j.ratelimiter.instances.userService.limitForPeriod=10
resilience4j.ratelimiter.instances.userService.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.userService.timeoutDuration=500ms

# ---------- Feign timeouts ----------
spring.cloud.openfeign.client.config.cart-service.connect-timeout=2000
spring.cloud.openfeign.client.config.cart-service.read-timeout=3000
spring.cloud.openfeign.client.config.product-service.connect-timeout=2000
spring.cloud.openfeign.client.config.product-service.read-timeout=3000
spring.cloud.openfeign.client.config.user-service.connect-timeout=2000
spring.cloud.openfeign.client.config.user-service.read-timeout=3000